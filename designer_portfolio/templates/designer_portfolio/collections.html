{% extends "designer_portfolio/base.html" %} {% load static %} {% block content
%} {% include "designer_portfolio/includes/slideshow.html" %}
<section class="collections">
  <h1 class="collections-title">Collections</h1>

  <div class="collections-grid">
    {% for col in collections %}
    <div class="collection-item">
      <a href="{% url 'collection_detail' slug=col.slug %}">
        <img
          src="{% static col.cover %}"
          alt="{{ col.slug }}"
          onerror="this.src='{% static 'images/placehold.png' %}'"
        />
        <div class="collection-caption">{{ col.title }}</div>
      </a>
    </div>
    {% endfor %}
  </div>
</section>

<style>
  .collections {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
    text-align: center;
  }

  .collections-title {
    font-size: 28px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 30px;
  }

  .collections-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
  }

  @media (max-width: 900px) {
    .collections-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
  }
  @media (max-width: 600px) {
    .collections-grid {
      grid-template-columns: 1fr;
      gap: 15px;
    }
  }

  .collection-item {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .collection-item:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    background: darkorange;
  }

  .collection-item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
  }

  .collection-caption {
    background: #280768;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 12px;
    line-height: 1.4;
  }
</style>
{% endblock %}

<style>
  .designers {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .designers-title {
    font-size: 32px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 40px;
    text-align: center;
    color: #280768;
  }

  .designers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 30px;
  }

  @media (max-width: 768px) {
    .designers-grid {
      grid-template-columns: 1fr;
      gap: 20px;
    }
  }

  .designer-item {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .designer-item:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px rgba(40, 7, 104, 0.15);
  }

  .designer-card {
    padding: 25px;
  }

  .designer-image {
    text-align: center;
    margin-bottom: 20px;
  }

  .designer-image img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #280768;
  }

  .designer-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #280768, #3d0a85);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    margin: 0 auto;
  }

  .designer-info {
    text-align: center;
  }

  .designer-name {
    font-size: 20px;
    font-weight: 700;
    color: #280768;
    margin: 0 0 8px 0;
  }

  .designer-brand {
    margin-bottom: 12px;
  }

  .brand-name {
    background: linear-gradient(135deg, #280768, #3d0a85);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .designer-location,
  .designer-experience {
    font-size: 14px;
    color: #666;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .designer-location i,
  .designer-experience i {
    color: #280768;
    font-size: 12px;
  }

  .designer-bio {
    font-size: 14px;
    color: #555;
    line-height: 1.5;
    margin: 15px 0;
    padding: 0 10px;
  }

  .designer-contact {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
  }

  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    color: white;
  }

  .email-btn {
    background: #dc3545;
  }

  .email-btn:hover {
    background: #c82333;
    color: white;
  }

  .portfolio-btn {
    background: #28a745;
  }

  .portfolio-btn:hover {
    background: #218838;
    color: white;
  }

  .instagram-btn {
    background: #e4405f;
  }

  .instagram-btn:hover {
    background: #d73647;
    color: white;
  }

  .linkedin-btn {
    background: #0077b5;
  }

  .linkedin-btn:hover {
    background: #005885;
    color: white;
  }

  .collaboration-badge {
    background: #d4edda;
    color: #155724;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
  }

  .collaboration-badge i {
    color: #28a745;
  }

  .no-designers {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: #666;
    font-size: 18px;
  }

  .no-designers p {
    margin: 0;
  }
</style>
{% endblock %}
