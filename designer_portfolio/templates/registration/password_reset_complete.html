{% extends "designer_portfolio/base.html" %}
{% block title %}Password Reset Complete | designer{% endblock %}
{% block content %}
<div class="login-container" style="max-width: 560px; margin: 60px auto; padding: 30px; background:#fff; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.1);">
  <h2 style="text-align:center; margin-bottom:16px; color:#280768;">Your password has been changed</h2>
  <p style="text-align:center; color:#333;">You can now sign in with your new password.</p>
  <div style="margin-top:18px; text-align:center;">
    <a href="{% url 'login' %}" style="color:#280768; text-decoration:none; font-weight:600;">Go to login</a>
  </div>
</div>
{% endblock %}
