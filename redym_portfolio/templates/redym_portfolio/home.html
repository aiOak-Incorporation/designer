{% extends "redym_portfolio/base.html" %}
{% load static %}

{% block content %}
<style>
/* --- Consolidated CSS Styles for Slideshow --- */
.banner {
  width: 95%;
  max-width: 2200px;
  margin: 70px auto;
  position: relative;
  /* Use aspect-ratio for responsiveness instead of fixed height */
  aspect-ratio: 18/7; 
  background: #f7f7f7;
  border-radius: 50px;
  overflow: hidden;
}
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease-in-out;
  background-size: cover;
  background-position: center;
}
.slide.is-active { opacity: 1; }

/* Arrows (Touch-friendly sizes) */
.arrow { 
  position: absolute; 
  top: 50%; 
  transform: translateY(-50%);
  background: rgba(40,7,104,0.7); 
  color: #fff; 
  border: none;
  font-size: 32px; 
  padding: 10px 16px; 
  border-radius: 50%;
  cursor: pointer; 
  z-index: 10; 
  transition: background 0.3s ease; 
  outline: none;
}
.arrow:hover, .arrow:focus { 
  background: gold; 
  color: #280768; 
}
.arrow.prev { left: 15px; }
.arrow.next { right: 15px; }

/* Dots */
.dots { 
  position: absolute; 
  bottom: 12px; 
  left: 50%; 
  transform: translateX(-50%);
  display: flex; 
  gap: 10px; 
  z-index: 5; 
}
.dot { 
  width: 12px; 
  height: 12px; 
  border-radius: 50%; 
  background: rgba(255,255,255,0.65);
  border: 1px solid rgba(0,0,0,0.2); 
  cursor: pointer; 
  transition: background 0.3s ease; 
}
.dot.is-active { 
  background: #fff; 
}
</style>

<section class="banner" aria-label="Featured Carousel">
  <!-- Slides (Uses Django static tag for image paths) -->
  <div class="slide is-active" style="background-image: url('{% static 'images/home/1.png' %}')"></div>
  <div class="slide" style="background-image: url('{% static 'images/home/2.png' %}')"></div>
  <div class="slide" style="background-image: url('{% static 'images/home/3.png' %}')"></div>

  <!-- Arrows -->
  <button class="arrow prev" onclick="prevSlide()" aria-label="Previous Slide">‹</button>
  <button class="arrow next" onclick="nextSlide()" aria-label="Next Slide">›</button>

  <!-- Dots -->
  <div class="dots" role="tablist">
    <span class="dot is-active" role="tab" aria-selected="true"></span>
    <span class="dot" role="tab" aria-selected="false"></span>
    <span class="dot" role="tab" aria-selected="false"></span>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    let i = 0;
    let interval = null;
    const SLIDE_DURATION = 4500; // 4.5 seconds

    console.log("Slides found:", slides.length);

    function showSlide(index) {
      // Use modulo arithmetic to ensure the index wraps correctly
      index = (index % slides.length + slides.length) % slides.length;

      slides.forEach((s, idx) => s.classList.toggle("is-active", idx === index));
      dots.forEach((d, idx) => {
        d.classList.toggle("is-active", idx === index);
        d.setAttribute("aria-selected", idx === index);
      });
      i = index;
    }

    // Export functions to the global scope for the HTML onclick attributes
    window.nextSlide = function() { showSlide(i + 1); }
    window.prevSlide = function() { showSlide(i - 1); }

    function startAutoSlide() { 
        stopAutoSlide(); // Clear existing interval before starting a new one
        interval = setInterval(window.nextSlide, SLIDE_DURATION); 
    }
    function stopAutoSlide() { clearInterval(interval); }

    dots.forEach((dot, idx) => {
      dot.addEventListener("click", () => {
        showSlide(idx);
        // Reset the timer when manually navigating
        stopAutoSlide();
        startAutoSlide();
      });
    });

    if (slides.length > 0) {
      showSlide(0); // Initialize on the first slide
      startAutoSlide();
    }
  });
</script>
{% endblock %}
