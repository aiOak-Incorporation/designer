{% extends "redym_portfolio/base.html" %} {% load static %} {% block content %}
{% include "redym_portfolio/includes/slideshow.html" %}
<section class="collections">
  <h1 class="collections-title">Collections</h1>

  <div class="collections-grid">
    {% for col in collections %}
    <div class="collection-item">
      <a href="{% url 'collection_detail' slug=col.slug %}">
        <img
          src="{% static col.cover %}"
          alt="{{ col.slug }}"
          onerror="this.src='{% static 'images/placehold.png' %}'"
        />
        <div class="collection-caption">{{ col.title }}</div>
      </a>
    </div>
    {% endfor %}
  </div>
</section>

<style>
  .collections {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
    text-align: center;
  }

  .collections-title {
    font-size: 28px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 30px;
  }

  .collections-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
  }

  @media (max-width: 900px) {
    .collections-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
  }
  @media (max-width: 600px) {
    .collections-grid {
      grid-template-columns: 1fr;
      gap: 15px;
    }
  }

  .collection-item {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .collection-item:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    background: darkorange;
  }

  .collection-item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
  }

  .collection-caption {
    background: #280768;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 12px;
    line-height: 1.4;
  }
</style>
{% endblock %}
